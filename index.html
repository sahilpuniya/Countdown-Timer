<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountDown Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>CountDown Timer</h1>

        <div class="time">
            <div id="days">
                <span>00</span>
                days
            </div>
            <div id="hours">
                <span>00</span>
                hrs
            </div>
            <div id="minutes">
                <span>00</span>
                 mins
            </div>
            <div id="seconds">
                <span>00</span>
                secs
            </div>
        </div>

        <div class="bottom">
            <h3>progress:-</h3>
        <div class="progresshead">
           
            <div id="progress-bar"></div>
        </div>
        </div>
              
    </div>
<script src="index.js"></script>    
</body>
</html>
